<div class="card-header">
  <div class="header-icon-container bg-{{ backgroundColor }}">
    <i-tabler name="{{ icon }}" class="header-icon scale-100"></i-tabler>
  </div>
  <div class="header-text">
    <h3 class="card-title">{{ title }}</h3>
    @if (subtitle) {
      <p class="card-subtitle">{{ subtitle }}</p>
    }
  </div>
</div>
