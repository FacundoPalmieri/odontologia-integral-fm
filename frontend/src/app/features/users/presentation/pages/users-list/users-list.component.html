<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Usuarios'"
    [totalCount]="store.totalElements()"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar usuario'"
    [searchValue]="userFilter.value || ''"
    (searchChange)="userFilter.setValue($event)"
    [showViewMode]="true"
    [viewMode]="viewMode()"
    (viewModeChange)="viewMode.set($event)"
    [showActionButton]="canCreate"
    [actionButtonIcon]="'plus'"
    [actionButtonText]="'Nuevo usuario'"
    (action)="createUser()"
  ></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    @if (canRead) {
      @if (viewMode() === "table") {
        <app-users-table
          [users]="filteredUsers()"
          [isLoading]="store.isLoading()"
          [skeletonRows]="tableSkeletonRows"
          [canUpdate]="canUpdate"
          (editUser)="editUser($event)"
        />
      } @else {
        <div class="mb-4">
          <app-users-cards
            [users]="filteredUsers()"
            [isLoading]="store.isLoading()"
            [skeletonRows]="cardsSkeletonRows"
            (editUser)="editUser($event)"
          />
        </div>
      }
    } @else {
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="flex items-center justify-center py-8">
            <mat-chip>No tienes permisos para acceder a este recurso.</mat-chip>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
