<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Tareas programadas'"
    [totalCount]="schedulesDataSource.filteredData.length"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar tarea programada'"
    [searchValue]="schedulesFilter.value || ''"
    (searchChange)="schedulesFilter.setValue($event)"
  ></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    <mat-card appearance="outlined">
      <mat-card-content>
        @if (isTableEmpty) {
          <app-empty-state
            [message]="'No se encontraron tareas programadas'"
          ></app-empty-state>
        } @else {
          <div class="overflow-x-auto">
            <table
              mat-table
              [dataSource]="schedulesDataSource"
              matSort
              #scheduleSort="matSort"
            >
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
                <td mat-cell *matCellDef="let element">{{ element.id }}</td>
              </ng-container>

              <ng-container matColumnDef="label">
                <th mat-header-cell *matHeaderCellDef>Descripción</th>
                <td mat-cell *matCellDef="let element">{{ element.label }}</td>
              </ng-container>

              <ng-container matColumnDef="cron">
                <th mat-header-cell *matHeaderCellDef>Cron</th>
                <td mat-cell *matCellDef="let element">{{ element.cron }}</td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Acción</th>
                <td mat-cell *matCellDef="let element">
                  <button
                    matIconButton
                    (click)="editSchedule(element)"
                    matTooltip="Editar"
                    matTooltipPosition="right"
                  >
                    <i-tabler name="edit"></i-tabler>
                  </button>
                </td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="schedulesDisplayedColumns"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: schedulesDisplayedColumns"
              ></tr>
            </table>
            <mat-paginator
              #schedulePaginator
              [pageSizeOptions]="[5, 10]"
              showFirstLastButtons="true"
              aria-label="Seleccionar página de tareas programadas"
            ></mat-paginator>
          </div>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
