<h2 mat-dialog-title class="!p-4 !flex items-center gap-2">
  <i-tabler name="user-shield" class="text-[var(--mat-sys-primary)]"></i-tabler>
  <span>Crear rol</span>
</h2>
<mat-dialog-content>
  <div
    class="p-4 bg-[var(--mat-sys-content-toolbar-container-color)] rounded-[var(--mat-sys-corner-large)]"
  >
    <form [formGroup]="roleForm" class="mt-1">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Alias</mat-label>
        <input matInput formControlName="label" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Permisos</mat-label>
        <mat-select
          name="permissionsSelect"
          formControlName="permissionsList"
          multiple
          [compareWith]="comparePermissions"
        >
          @for (permission of permissions; track $index) {
            <mat-option [value]="permission">{{ permission.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    [mat-dialog-close]="roleForm.value"
    [disabled]="!roleForm.valid"
  >
    Crear
  </button>
</mat-dialog-actions>
