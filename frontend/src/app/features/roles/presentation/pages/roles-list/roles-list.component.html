<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Roles'"
    [totalCount]="rolesDataSource.filteredData.length"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar rol'"
    [searchValue]="rolesFilter.value || ''"
    (searchChange)="rolesFilter.setValue($event)"
  ></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    <mat-card appearance="outlined">
      <mat-card-content>
        <div class="overflow-x-auto">
          <table
            mat-table
            [dataSource]="rolesDataSource"
            matSort
            #rolesSort="matSort"
          >
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
              <td mat-cell *matCellDef="let element">{{ element.id }}</td>
            </ng-container>

            <ng-container matColumnDef="label">
              <th mat-header-cell *matHeaderCellDef>Alias</th>
              <td mat-cell *matCellDef="let element">
                {{ element.label }}
              </td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nombre</th>
              <td mat-cell *matCellDef="let element">{{ element.name }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef>Acción</th>
              <td mat-cell *matCellDef="let element">
                <button
                  matIconButton
                  (click)="editRole(element)"
                  matTooltip="Editar"
                  matTooltipPosition="right"
                >
                  <i-tabler name="edit"></i-tabler>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="rolesDisplayedColumns"></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: rolesDisplayedColumns"
            ></tr>
          </table>
          <mat-paginator
            #rolesPaginator
            [pageSizeOptions]="[5, 10]"
            showFirstLastButtons="true"
            aria-label="Seleccionar página de usuarios"
          ></mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
