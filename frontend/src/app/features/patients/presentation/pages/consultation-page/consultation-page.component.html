<div class="flex flex-col gap-4">
  <!-- Patient Header Card -->
  <app-consultation-patient-header
    [patientName]="patientName()"
    [patientDni]="patientDni()"
    [patientAge]="patientAge()"
    [avatarUrl]="avatarUrl()"
    [lastVisit]="lastVisit()"
    [consultations]="consultations()"
    [selectedConsultation]="selectedConsultation()"
    (consultationChange)="onConsultationChange($event)"
  />

  <!-- Odontogram: full-width expansion panel -->
  <mat-expansion-panel [expanded]="false" class="!shadow-none">
    <mat-expansion-panel-header
      collapsedHeight="80px"
      expandedHeight="80px"
      class="!p-4"
    >
      <mat-panel-title class="[&_.card-header]:!mb-0">
        <app-card-icon-title
          [title]="'Odontograma Interactivo'"
          [subtitle]="'Revisá el estado dental del paciente'"
          [icon]="'dental'"
          [backgroundColor]="'green'"
        />
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="overflow-x-auto">
      <app-odontogram
        [odontogram]="odontogram"
        [showToolbox]="true"
        [showTemporaries]="true"
        [showDateSelector]="false"
      />
    </div>
  </mat-expansion-panel>

  <!-- 2-column grid: treatments + summary -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: treatments table -->
    <div class="lg:col-span-2">
      <app-prestation-table
        [treatments]="treatments()"
        (addTreatment)="openAddPrestationDialog()"
      />
    </div>

    <!-- Right: cost summary + observations -->
    <div class="flex flex-col gap-4">
      <app-consultation-summary-panel [treatments]="treatments()" />
    </div>
  </div>
</div>
