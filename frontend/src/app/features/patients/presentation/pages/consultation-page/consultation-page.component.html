<div class="fixed bottom-8 right-8 z-[99]">
  <button
    mat-raised-button
    (click)="finishConsultation()"
    class="!shadow-2xl !bg-[var(--mat-sys-secondary)] !text-[var(--mat-sys-on-secondary)] !px-6 !py-6 font-semibold text-base rounded-full"
  >
    <span class="flex items-center gap-2">
      <i-tabler name="circle-check"></i-tabler>
      Finalizar consulta
    </span>
  </button>
</div>

<div class="flex flex-col gap-4 pb-16">
  <!-- Patient Header Card -->
  <app-consultation-patient-header
    [patientName]="patientName()"
    [patientDni]="patientDni()"
    [patientAge]="patientAge()"
    [avatarUrl]="avatarUrl()"
    [lastVisit]="lastVisit()"
    [consultations]="consultations()"
    [selectedConsultation]="selectedConsultation()"
    (consultationChange)="onConsultationChange($event)"
  />

  <!-- Odontogram: full-width expansion panel -->
  <mat-expansion-panel [expanded]="false" class="!shadow-none">
    <mat-expansion-panel-header
      collapsedHeight="80px"
      expandedHeight="80px"
      class="!p-4"
    >
      <mat-panel-title class="[&_.card-header]:!mb-0 !flex !flex-row !justify-between !items-center !w-full">
        <app-card-icon-title
          [title]="'Odontograma Interactivo'"
          [subtitle]="'Revisá el estado dental del paciente'"
          [icon]="'dental'"
          [backgroundColor]="'green'"
        />
        <button
          mat-icon-button
          (click)="$event.stopPropagation(); openOdontogramDialog()"
          matTooltip="Ver odontograma ampliado"
          class="mr-2"
          aria-label="Ver odontograma ampliado"
        >
          <i-tabler name="maximize"></i-tabler>
        </button>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="overflow-x-auto">
      <app-odontogram
        [odontogram]="odontogram"
        [showToolbox]="true"
        [showTemporaries]="true"
        [showDateSelector]="false"
      />
    </div>
  </mat-expansion-panel>

  <!-- Treatments Table -->
  <app-prestation-table
    [treatments]="treatments()"
    (addTreatment)="openAddPrestationDialog()"
    (scopeChange)="onScopeChange($event)"
  />

  <!-- Observations -->
  <app-consultation-observations-panel
    [control]="observationsControl"
  />

  <!-- Cost Summary -->
  <app-consultation-summary-panel
    [treatments]="treatments()"
  />
</div>
