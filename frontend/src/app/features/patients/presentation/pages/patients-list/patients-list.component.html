<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Pacientes'"
    [totalCount]="store.totalElements()"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar paciente'"
    [searchValue]="patientsFilter.value || ''"
    (searchChange)="patientsFilter.setValue($event)"
    [showViewMode]="true"
    [viewMode]="viewMode()"
    (viewModeChange)="viewMode.set($event)"
    [showActionButton]="canCreate"
    [actionButtonIcon]="'plus'"
    [actionButtonText]="'Nuevo paciente'"
    (action)="createPatient()"
  ></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    @if (canRead) {
      @if (viewMode() === "table") {
        <app-patients-table
          [patients]="filteredPatients()"
          [isLoading]="store.isLoading()"
          [skeletonRows]="tableSkeletonRows"
          (viewProfile)="viewProfile($event)"
          (openConsultation)="openConsultation($event)"
        />
      } @else {
        <div class="mb-4">
          <app-patients-cards
            [patients]="filteredPatients()"
            [isLoading]="store.isLoading()"
            [skeletonRows]="cardsSkeletonRows"
            (viewProfile)="viewProfile($event)"
            (openConsultation)="openConsultation($event)"
          />
        </div>
      }
    } @else {
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="flex items-center justify-center py-8">
            <mat-chip>No tienes permisos para acceder a este recurso.</mat-chip>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
