<div class="flex flex-col gap-6">
  <!-- Cost Summary -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <app-card-icon-title
        [title]="'Resumen'"
        [icon]="'receipt'"
        [backgroundColor]="'green'"
      ></app-card-icon-title>
    </mat-card-header>

    <mat-card-content>
      <div class="flex flex-col gap-2">
        <div class="flex justify-between text-sm">
          <span>Subtotal Prestaciones</span>
          <span>${{ subtotal().toFixed(2) }}</span>
        </div>
        <div class="flex justify-between text-sm">
          <span>IVA (15%)</span>
          <span>${{ iva().toFixed(2) }}</span>
        </div>
        <hr class="border-white/20 my-1" />
        <div class="flex justify-between font-bold text-lg">
          <span>Total a Pagar</span>
          <span>${{ total().toFixed(2) }}</span>
        </div>
      </div></mat-card-content
    >
  </mat-card>

  <!-- Observations -->
  <mat-card appearance="outlined">
    <mat-card-header>
      <app-card-icon-title
        [title]="'Observaciones'"
        [icon]="'notes'"
        [backgroundColor]="'gray'"
      ></app-card-icon-title>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field
        appearance="outline"
        class="w-full"
        subscriptSizing="dynamic"
      >
        <textarea
          matInput
          [formControl]="observationsControl"
          placeholder="Ingrese notas clínicas, recomendaciones post-tratamiento o hallazgos de esta sesión..."
          rows="6"
        ></textarea>
      </mat-form-field>
    </mat-card-content>
  </mat-card>
</div>
