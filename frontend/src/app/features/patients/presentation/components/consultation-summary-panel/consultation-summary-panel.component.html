<!-- Cost Summary -->
<mat-card appearance="outlined">
  <mat-card-header>
    <app-card-icon-title
      [title]="'Resumen'"
      [icon]="'receipt'"
      [backgroundColor]="'green'"
    ></app-card-icon-title>
  </mat-card-header>

  <mat-card-content>
    <div class="flex flex-col gap-2">
      <div class="flex justify-between text-sm">
        <span>Subtotal Prestaciones</span>
        <span>$<span [appCurrencyFormat]="subtotal()"></span></span>
      </div>
      <div class="flex justify-between text-sm">
        <span>IVA (15%)</span>
        <span>$<span [appCurrencyFormat]="iva()"></span></span>
      </div>
      <hr class="border-white/20 my-1" />
      <div class="flex justify-between font-bold text-lg">
        <span>Total a Pagar</span>
        <span>$<span [appCurrencyFormat]="total()"></span></span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
