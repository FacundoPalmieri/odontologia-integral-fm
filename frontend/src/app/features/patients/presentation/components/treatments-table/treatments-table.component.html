<mat-card appearance="outlined">
  <mat-card-header>
    <app-card-icon-title
      [title]="'Tratamientos'"
      [subtitle]="'Diagnósticos abiertos del paciente'"
      [icon]="'report-search'"
      [backgroundColor]="'purple'"
    />
  </mat-card-header>

  <mat-card-content>
    @if (!treatments().length) {
      <app-empty-state [message]="'El paciente no tiene tratamientos abiertos'" />
    } @else {
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="treatments()" class="w-full">
          <ng-container matColumnDef="label">
            <th mat-header-cell *matHeaderCellDef>Tratamiento</th>
            <td mat-cell *matCellDef="let row">{{ row.label }}</td>
          </ng-container>

          <ng-container matColumnDef="scope">
            <th mat-header-cell *matHeaderCellDef>Ubicación</th>
            <td mat-cell *matCellDef="let row">{{ scopeLabel(row.scope) }}</td>
          </ng-container>

          <ng-container matColumnDef="condition">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <div class="flex items-center gap-2">
                <span
                  class="inline-block w-3.5 h-3.5 rounded-full"
                  [style.background-color]="conditionColor(row.treatmentCondition)"
                ></span>
                <span>{{ conditionLabel(row.treatmentCondition) }}</span>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
