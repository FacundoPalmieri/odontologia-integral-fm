<mat-card appearance="outlined" class="w-full">
  <mat-card-header>
    <app-card-icon-title
      [title]="'Observaciones'"
      [icon]="'notes'"
      [backgroundColor]="'gray'"
    ></app-card-icon-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field
      appearance="outline"
      class="w-full"
      subscriptSizing="dynamic"
    >
      <textarea
        matInput
        [formControl]="control()"
        placeholder="Ingrese notas clínicas, recomendaciones post-tratamiento o hallazgos de esta sesión..."
        style="height: 140px; resize: vertical;"
      ></textarea>
    </mat-form-field>
  </mat-card-content>
</mat-card>
