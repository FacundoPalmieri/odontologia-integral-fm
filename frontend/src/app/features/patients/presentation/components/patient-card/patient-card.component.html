<mat-card appearance="outlined" class="h-full flex flex-col">
  <!-- HEADER: avatar + name + actions -->
  <mat-card-header class="flex items-start gap-3 !pb-0">
    <div
      class="w-14 h-14 rounded-full overflow-hidden border-2 border-[var(--mat-sys-outline-variant)] shrink-0 mt-1"
    >
      <img
        [src]="patient().avatarUrl"
        [alt]="patient().person.firstName + ' ' + patient().person.lastName"
        class="w-full h-full object-cover"
      />
    </div>
    <div class="flex flex-col flex-1 min-w-0 pt-1">
      <span class="font-semibold text-base leading-tight break-words">
        {{ patient().person.firstName }} {{ patient().person.lastName }}
      </span>
      <span class="text-xs text-[var(--mat-sys-on-surface-variant)] mt-1">
        DNI: {{ patient().person.dni }}
      </span>
    </div>

    <button
      matIconButton
      [matMenuTriggerFor]="menu"
      class="!ml-auto shrink-0 -mt-2 -mr-2"
      aria-label="Acciones de paciente"
    >
      <i-tabler class="mb-1" name="dots-vertical"></i-tabler>
    </button>
    <mat-menu #menu="matMenu" xPosition="before">
      <button mat-menu-item (click)="viewProfile.emit(patient())">
        <div
          class="flex items-center gap-2 text-[var(--mat-sys-on-surface-variant-muted)]"
        >
          <i-tabler name="report-search"></i-tabler>
          <span>Ver ficha médica</span>
        </div>
      </button>
      <button mat-menu-item (click)="openConsultation.emit(patient())">
        <div
          class="flex items-center gap-2 text-[var(--mat-sys-on-surface-variant-muted)]"
        >
          <i-tabler name="stethoscope"></i-tabler>
          <span>Ver consultas</span>
        </div>
      </button>
    </mat-menu>
  </mat-card-header>

  <!-- CONTENT -->
  <mat-card-content class="!flex !flex-col !gap-3 !flex-1 !pt-4">
    <mat-divider class="!my-1 opacity-40"></mat-divider>

    <!-- Email -->
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[10px] font-semibold tracking-widest text-[var(--mat-sys-on-surface-variant)] uppercase"
      >
        Email
      </span>
      <div class="flex items-center gap-1.5">
        <i-tabler
          name="mail"
          class="text-[var(--mat-sys-on-surface-variant)] scale-90 shrink-0"
        ></i-tabler>
        <span class="text-sm truncate">
          {{ patient().person.contactEmails[0] || "—" }}
        </span>
      </div>
    </div>

    <!-- Phone -->
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[10px] font-semibold tracking-widest text-[var(--mat-sys-on-surface-variant)] uppercase"
      >
        Teléfono
      </span>
      <div class="flex items-center gap-1.5">
        <i-tabler
          name="phone"
          class="text-[var(--mat-sys-on-surface-variant)] scale-90 shrink-0"
        ></i-tabler>
        <span class="text-sm">
          {{ patient().person.contactPhone[0]?.phone || "—" }}
        </span>
      </div>
    </div>

    <!-- Obra social -->
    <div class="flex flex-col gap-0.5">
      <span
        class="text-[10px] font-semibold tracking-widest text-[var(--mat-sys-on-surface-variant)] uppercase"
      >
        Obra social
      </span>
      <div class="flex items-center gap-1.5">
        <i-tabler
          name="shield-heart"
          class="text-[var(--mat-sys-on-surface-variant)] scale-90 shrink-0"
        ></i-tabler>
        <span class="text-sm">
          {{ patient().healthPlans || "—" }}
        </span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
