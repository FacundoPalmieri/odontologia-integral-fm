<mat-card appearance="outlined">
  <mat-card-title class="!flex !flex-row !justify-between p-4">
    <app-card-icon-title
      [title]="'Tratamientos realizados'"
      [icon]="'bandage'"
      [backgroundColor]="'red'"
    ></app-card-icon-title>
    <button
      matButton
      class="flex items-center text-sm font-semibold"
      (click)="addTreatment.emit()"
    >
      <div class="flex items-center">
        <i-tabler name="plus"></i-tabler>
        Añadir prestación
      </div>
    </button>
  </mat-card-title>

  <mat-card-content>
    <!-- Table -->
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="treatments()" class="w-full">
        <!-- Tooth -->
        <ng-container matColumnDef="tooth">
          <th mat-header-cell *matHeaderCellDef>Pieza</th>
          <td mat-cell *matCellDef="let row" class="font-semibold">
            {{ row.tooth }}
          </td>
        </ng-container>

        <!-- Procedure -->
        <ng-container matColumnDef="procedure">
          <th mat-header-cell *matHeaderCellDef>Procedimiento</th>
          <td mat-cell *matCellDef="let row">{{ row.procedure }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let row">
            @switch (row.status) {
              @case ("completed") {
                <span
                  class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-green-100 text-green-700"
                  >Completado</span
                >
              }
              @case ("in-progress") {
                <span
                  class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-blue-100 text-blue-700"
                  >En Curso</span
                >
              }
              @default {
                <span
                  class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-yellow-100 text-yellow-700"
                  >Pendiente</span
                >
              }
            }
          </td>
        </ng-container>

        <!-- Cost -->
        <ng-container matColumnDef="cost">
          <th mat-header-cell *matHeaderCellDef class="text-right">Costo</th>
          <td mat-cell *matCellDef="let row" class="text-right font-semibold">
            ${{ row.cost.toFixed(2) }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors"
        ></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
