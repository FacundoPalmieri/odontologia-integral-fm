<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Gestión de Turnos'"
    [totalCount]="appointments().length"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar paciente'"
    [searchValue]="patientSearchControl.value"
    (searchChange)="patientSearchControl.setValue($event)"
    [showSelectFilter]="true"
    [selectFilterPlaceholder]="'Profesionales'"
    [selectFilterIcon]="'nurse'"
    [selectFilterOptions]="dentistsOptions()"
    [selectFilterValue]="professionalsControl.value"
    (selectFilterChange)="professionalsControl.setValue($any($event))"
    [showViewMode]="true"
    [viewMode]="viewMode()"
    (viewModeChange)="viewMode.set($event)"
    [showActionButton]="canCreate"
    [actionButtonIcon]="'plus'"
    [actionButtonText]="'Nuevo turno'"
    (action)="createAppointment()"
  ></app-page-toolbar>

  <div class="mt-4 rounded-[var(--mat-sys-corner-medium)]">
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
      <mat-card
        class="cursor-pointer background-waiting transition-all duration-300"
        appearance="outlined"
        [class.scale-102]="activeFilter() === 'waiting'"
        [style.borderColor]="activeFilter() === 'waiting' ? '#f9c20a' : ''"
        [style.boxShadow]="
          activeFilter() === 'waiting' ? '0 0 0 1px #f9c20a' : ''
        "
        (click)="toggleWaiting()"
      >
        <mat-card-content>
          <div class="flex items-center justify-start gap-4">
            <div class="rounded-xl bg-[#f9c20a] flex p-2">
              <i-tabler
                class="text-white scale-130"
                name="hourglass"
              ></i-tabler>
            </div>
            <div class="flex-col flex">
              <span class="text-sm">En espera</span>
              <span class="font-bold">4 pacientes</span>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card
        class="cursor-pointer background-in-progress transition-all duration-300"
        appearance="outlined"
        [class.scale-102]="activeFilter() === 'in-progress'"
        [style.borderColor]="activeFilter() === 'in-progress' ? '#fb923c' : ''"
        [style.boxShadow]="
          activeFilter() === 'in-progress' ? '0 0 0 1px #fb923c' : ''
        "
        (click)="toggleInProgress()"
      >
        <mat-card-content>
          <div class="flex items-center justify-start gap-4">
            <div class="rounded-xl bg-[#fb923c] flex p-2">
              <i-tabler
                class="text-white scale-130"
                name="stethoscope"
              ></i-tabler>
            </div>
            <div class="flex-col flex">
              <span class="text-sm">En consulta</span>
              <span class="font-bold">2 pacientes</span>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card
        class="cursor-pointer background-pending-payment transition-all duration-300"
        appearance="outlined"
        [class.scale-102]="activeFilter() === 'pending-payment'"
        [style.borderColor]="
          activeFilter() === 'pending-payment' ? '#635bff' : ''
        "
        [style.boxShadow]="
          activeFilter() === 'pending-payment' ? '0 0 0 1px #635bff' : ''
        "
        (click)="togglePendingPayment()"
      >
        <mat-card-content>
          <div class="flex items-center justify-start gap-4">
            <div class="rounded-xl bg-[#635bff] flex p-2">
              <i-tabler
                class="text-white scale-130"
                name="credit-card"
              ></i-tabler>
            </div>
            <div class="flex-col flex">
              <span class="text-sm">Pendientes de pago</span>
              <span class="font-bold">3 pacientes</span>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card
        class="cursor-pointer background-finalized transition-all duration-300"
        appearance="outlined"
        [style.borderColor]="activeFilter() === 'finalized' ? '#10b981' : ''"
        [style.boxShadow]="
          activeFilter() === 'finalized' ? '0 0 0 1px #10b981' : ''
        "
        (click)="toggleFinalized()"
      >
        <mat-card-content>
          <div class="flex items-center justify-start gap-4">
            <div class="rounded-xl bg-[#10b981] flex p-2">
              <i-tabler
                class="text-white scale-130"
                name="circle-check"
              ></i-tabler>
            </div>
            <div class="flex-col flex">
              <span class="text-sm">Finalizados</span>
              <span class="font-bold">3 pacientes</span>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card
        class="cursor-pointer background-canceled transition-all duration-300"
        appearance="outlined"
        [class.scale-102]="activeFilter() === 'canceled'"
        [style.borderColor]="activeFilter() === 'canceled' ? '#f56565' : ''"
        [style.boxShadow]="
          activeFilter() === 'canceled' ? '0 0 0 1px #f56565' : ''
        "
        (click)="toggleCanceled()"
      >
        <mat-card-content>
          <div class="flex items-center justify-start gap-4">
            <div class="rounded-xl bg-[#f56565] flex p-2">
              <i-tabler class="text-white scale-130" name="circle-x"></i-tabler>
            </div>
            <div class="flex-col flex">
              <span class="text-sm">Cancelados</span>
              <span class="font-bold">2 pacientes</span>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    @if (viewMode() === "table") {
      <div class="mt-4">
        <app-appointments-table [appointments]="appointments()" />
      </div>
    } @else {
      <div class="my-4">
        <app-appointments-cards [appointments]="appointments()" />
      </div>
    }
  </div>
</div>
