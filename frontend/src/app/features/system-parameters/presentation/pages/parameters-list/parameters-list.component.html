<div class="flex flex-col h-full">
  <app-page-toolbar
    [title]="'Parámetros del sistema'"
    [totalCount]="systemParametersDataSource.filteredData.length"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar parámetro'"
    [searchValue]="systemParametersFilter.value || ''"
    (searchChange)="systemParametersFilter.setValue($event)"
  ></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    <mat-card appearance="outlined">
      <mat-card-content>
        @if (isTableEmpty) {
          <app-empty-state
            [message]="'No se encontraron parámetros'"
          ></app-empty-state>
        } @else {
          <div class="overflow-x-auto">
          <table
            mat-table
            [dataSource]="systemParametersDataSource"
            matSort
            #systemParametersSort="matSort"
          >
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
              <td mat-cell *matCellDef="let element">{{ element.id }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let element">
                {{ element.description }}
              </td>
            </ng-container>

            <ng-container matColumnDef="value">
              <th mat-header-cell *matHeaderCellDef>Valor</th>
              <td mat-cell *matCellDef="let element">{{ element.value }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef>Acción</th>
              <td mat-cell *matCellDef="let element">
                <button
                  matIconButton
                  (click)="editSystemParameter(element)"
                  matTooltip="Editar"
                  matTooltipPosition="right"
                >
                  <i-tabler name="edit"></i-tabler>
                </button>
              </td>
            </ng-container>

            <tr
              mat-header-row
              *matHeaderRowDef="systemParametersDisplayedColumns"
            ></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: systemParametersDisplayedColumns"
            ></tr>
          </table>
          <mat-paginator
            #systemParametersPaginator
            [pageSizeOptions]="[5, 10]"
            showFirstLastButtons="true"
            aria-label="Seleccionar página de parámetros"
          ></mat-paginator>
        </div>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
