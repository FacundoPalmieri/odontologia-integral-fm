<div class="flex flex-col h-full">
  <app-page-toolbar [title]="'Parámetros del sistema'"></app-page-toolbar>

  <div class="overflow-y-auto mt-4 rounded-[var(--mat-sys-corner-medium)]">
    <mat-card appearance="outlined">
      <mat-card-content>
        <div class="w-1/2 flex mt-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Buscar parámetro</mat-label>
            <input
              type="text"
              matInput
              [formControl]="systemParametersFilter"
            />
            <i-tabler matSuffix name="search" class="mx-4"></i-tabler>
          </mat-form-field>
        </div>
        <div class="overflow-x-auto">
          <table
            mat-table
            [dataSource]="systemParametersDataSource"
            matSort
            #systemParametersSort="matSort"
          >
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
              <td mat-cell *matCellDef="let element">{{ element.id }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let element">
                {{ element.description }}
              </td>
            </ng-container>

            <ng-container matColumnDef="value">
              <th mat-header-cell *matHeaderCellDef>Valor</th>
              <td mat-cell *matCellDef="let element">{{ element.value }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef>Acción</th>
              <td mat-cell *matCellDef="let element">
                <button
                  matIconButton
                  (click)="editSystemParameter(element)"
                  matTooltip="Editar"
                  matTooltipPosition="right"
                >
                  <i-tabler name="edit"></i-tabler>
                </button>
              </td>
            </ng-container>

            <tr
              mat-header-row
              *matHeaderRowDef="systemParametersDisplayedColumns"
            ></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: systemParametersDisplayedColumns"
            ></tr>
          </table>
          <mat-paginator
            #systemParametersPaginator
            [pageSizeOptions]="[5, 10]"
            showFirstLastButtons="true"
            aria-label="Seleccionar página de usuarios"
          ></mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
