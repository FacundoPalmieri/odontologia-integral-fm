<h2 mat-dialog-title class="!p-4 !flex items-center gap-2">
  <i-tabler name="cancel" class="text-red-500"></i-tabler>
  <span>Cancelar turno</span>
</h2>
<mat-dialog-content>
  <p class="mb-4 text-[var(--mat-sys-on-surface-variant)]">
    ¿Está seguro que desea cancelar el turno de
    <strong>{{ data.conflict.patientName }}</strong
    >?
  </p>
  <mat-form-field class="w-full">
    <mat-label>Observación</mat-label>
    <input
      matInput
      [formControl]="observationControl"
      maxlength="50"
      placeholder="Ingrese el motivo de la cancelación"
      required
    />
    <mat-hint align="end"
      >{{ observationControl.value?.length || 0 }}/50</mat-hint
    >
    @if (observationControl.hasError('required') && observationControl.touched)
    {
    <mat-error>La observación es obligatoria</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="{ confirmed: false }">Cancelar</button>
  <button
    mat-flat-button
    color="warn"
    [disabled]="observationControl.invalid"
    [mat-dialog-close]="{
      confirmed: true,
      observation: observationControl.value
    }"
  >
    Confirmar
  </button>
</mat-dialog-actions>
