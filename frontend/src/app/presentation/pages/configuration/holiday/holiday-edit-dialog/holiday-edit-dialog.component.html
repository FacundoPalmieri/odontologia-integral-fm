<h2 mat-dialog-title class="!p-4 !flex items-center gap-2">
  <i-tabler
    name="calendar-cancel"
    class="text-[var(--mat-sys-primary)]"
  ></i-tabler>
  <span>Editar feriado</span>
</h2>
<mat-dialog-content>
  <div
    class="p-4 bg-[var(--mat-sys-content-toolbar-container-color)] rounded-[var(--mat-sys-corner-large)]"
  >
    <form [formGroup]="holidayForm" class="flex flex-col">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>ID</mat-label>
        <input matInput formControlName="id" readonly />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full !mb-0">
        <mat-label><span>Fecha</span></mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full !mb-0">
        <mat-label><span>Tipo</span></mat-label>
        <mat-select formControlName="type" [compareWith]="compareHolidayTypes">
          @for (type of holidaysTypes(); track $index) {
            <mat-option [value]="type">{{ type.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="flex flex-col md:flex-row gap-2">
  <button mat-button mat-dialog-close class="w-full md:w-auto">Cancelar</button>
  <button
    mat-flat-button
    (click)="save()"
    [disabled]="!holidayForm.valid"
    cdkFocusInitial
    class="w-full md:w-auto"
  >
    Guardar
  </button>
</mat-dialog-actions>
