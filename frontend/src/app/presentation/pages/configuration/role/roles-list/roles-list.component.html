<app-page-toolbar [title]="'Roles'"></app-page-toolbar>
<mat-card appearance="outlined" class="mt-4">
  <mat-card-content>
    <ng-container *ngIf="canRead; else noAccess">
      <div class="w-1/2 flex">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Buscar rol</mat-label>
          <input type="text" matInput [formControl]="rolesFilter" />
          <i-tabler matSuffix name="search" class="mx-4"></i-tabler>
        </mat-form-field>
      </div>
      <div class="overflow-x-auto">
        <table
          mat-table
          [dataSource]="rolesDataSource"
          matSort
          #rolesSort="matSort"
        >
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>

          <ng-container matColumnDef="label">
            <th mat-header-cell *matHeaderCellDef>Alias</th>
            <td mat-cell *matCellDef="let element">
              {{ element.label }}
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Acción</th>
            <td mat-cell *matCellDef="let element">
              <button
                *ngIf="canUpdate"
                mat-icon-button
                (click)="editRole(element)"
                matTooltip="Editar"
                matTooltipPosition="right"
              >
                <i-tabler name="edit"></i-tabler>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="rolesDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: rolesDisplayedColumns"></tr>
        </table>
        <mat-paginator
          #rolesPaginator
          [pageSizeOptions]="[5, 10]"
          showFirstLastButtons="true"
          aria-label="Seleccionar página de usuarios"
        ></mat-paginator>
      </div>
    </ng-container>
    <ng-template #noAccess>
      <div class="flex items-center justify-center py-8">
        <mat-chip>No tienes permisos para acceder a este recurso.</mat-chip>
      </div>
    </ng-template>
  </mat-card-content>
</mat-card>
