<h2 mat-dialog-title>
  <span>Editar datos personales</span>
</h2>

<mat-dialog-content>
  <div
    class="p-4 rounded-[var(--mat-sys-corner-medium)] bg-[var(--mat-sys-content-toolbar-container-color)]"
  >
    <app-person-form
      [person]="personData"
      (formValid)="onFormValidChange($event)"
      (formValue)="onFormValueChange($event)"
    ></app-person-form>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!p-4">
  <button mat-button mat-dialog-close>
    <div class="flex items-center gap-2">
      <span>Cancelar</span>
    </div>
  </button>
  <button mat-flat-button [disabled]="!isFormValid" (click)="save()">
    <div class="flex items-center gap-2">
      <span>Guardar</span>
    </div>
  </button>
</mat-dialog-actions>
